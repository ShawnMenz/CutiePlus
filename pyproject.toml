[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.yapf]
based_on_style = "pep8"
indent_width = 4
column_limit = 100

[project]
name = "cutieplus"
version = "0.1.0"
authors = [{ name = "Zexuan Meng" }]
description = "A multi-annotator video object segmentation annotation tool built upon Cutie."
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]
# GUI + scripting API. Training and benchmark evaluation are optional extras below.
dependencies = [
  'torch >= 2.6',
  'torchvision >= 0.21',
  'numpy >= 1.26',
  'Pillow >= 9.5',
  'opencv-python-headless >= 4.8, < 5',
  'scipy >= 1.7',
  'tqdm >= 4.66.1',
  'einops >= 0.6',
  'hydra-core >= 1.3.2',
  'requests',
  'av >= 12',
  'PySide6 >= 6.5',
  'pyqtdarktheme-fork',
  # the RITM click model compiles gui/ritm/utils/cython/_get_dist_maps.pyx at runtime
  'cython',
]

[project.optional-dependencies]
train = [
  'tensorboard >= 2.11',
  'gitpython >= 3.1',
  'thinplate @ git+https://github.com/cheind/py-thin-plate-spline',
]
eval = [
  'pycocotools >= 2.0.7',
  'hickle >= 5.0',
]

[tool.hatch.build.targets.wheel]
packages = ["cutie", "gui"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[project.urls]
"Homepage" = "https://github.com/ShawnMenz/CutiePlus"
"Repository" = "https://github.com/ShawnMenz/CutiePlus"
"Bug Tracker" = "https://github.com/ShawnMenz/CutiePlus/issues"
"Upstream" = "https://github.com/hkchengrex/Cutie"
